<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTA SA 3D Studio</title>
<style>
:root{--bg:#f4f4f6;--panel:#fff;--tx:#1b1b22;--mu:#6b6b78;--ac:#e8334a;--bd:#dcdce2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e13;--panel:#181820;--tx:#ececf2;--mu:#8d8d9c;--bd:#2a2a36}}
:root[data-theme="dark"]{--bg:#0e0e13;--panel:#181820;--tx:#ececf2;--mu:#8d8d9c;--bd:#2a2a36}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--panel)}
header h1{font-size:16px;margin:0;flex:1}
.tabs button,.btn,select,input[type=number]{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--bd);background:var(--panel);color:var(--tx);border-radius:8px;cursor:pointer}
.tabs button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
main{flex:1;display:flex;min-height:0}
aside{width:250px;border-inline-end:1px solid var(--bd);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.up{padding:10px;display:flex;gap:6px;border-bottom:1px solid var(--bd)}
.up input[type=number]{width:70px}
#list{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13px}
.it.on{border-color:var(--ac)}
.it b{color:var(--ac);min-width:34px}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it i{color:var(--mu);font-style:normal;padding:0 4px}
#stage{flex:1;position:relative;min-width:0}
#cv{position:absolute;inset:0;width:100%;height:100%}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu);font-size:14px;padding:20px;pointer-events:none}
#ctl{position:absolute;inset-inline:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px;background:linear-gradient(transparent,rgba(0,0,0,.45))}
#ctl label{font-size:12px;color:#fff;display:flex;flex-direction:column;gap:3px}
#ctl select{min-width:110px}
@media(max-width:700px){main{flex-direction:column}aside{width:100%;height:36%;border-inline-end:0;border-bottom:1px solid var(--bd)}}
</style>
</head>
<body>
<header>
  <h1>GTA SA 3D Studio</h1>
  <div class="tabs"><button id="tS" class="on">اسکین‌ها</button> <button id="tC">ماشین‌ها</button></div>
</header>
<main>
  <aside>
    <div class="up">
      <input type="number" id="num" placeholder="ID" min="0">
      <button class="btn pri" id="upb" style="flex:1">آپلود GLB</button>
      <input type="file" id="file" accept=".glb,.gltf" multiple hidden>
    </div>
    <div id="list"></div>
  </aside>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="msg">فایل GLB آپلود کن یا از لیست یکی را انتخاب کن</div>
    <div id="ctl">
      <label>انیمیشن<select id="anim"><option value="-1">بدون انیمیشن</option></select></label>
      <label>نور<select id="light"><option value="studio">Studio</option><option value="neon">Neon</option><option value="sunset">Sunset</option><option value="moon">Moonlight</option><option value="spot">Spotlight</option></select></label>
      <label>افکت<select id="aura"><option value="">خاموش</option><option value="✨">✨ Sparkles</option><option value="🔥">🔥 Embers</option><option value="❄️">❄️ Snow</option><option value="💡">💡 Fireflies</option><option value="💜">💜 Hearts</option></select></label>
      <label>&nbsp;<button class="btn" id="spin">چرخش خودکار: روشن</button></label>
    </div>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/GLTFLoader.js"></script>
<script>
const $=id=>document.getElementById(id);
let tab='skin',items=[],cur=null,db=null,model=null,mixer=null,clips=[],action=null,wheels=[],spin=true,auraPts=null,auraType='';
// ---- storage (IndexedDB, falls back to memory)
function openDB(){return new Promise(r=>{try{const q=indexedDB.open('gta-studio',1);q.onupgradeneeded=()=>q.result.createObjectStore('m',{keyPath:'key'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}})}
function dbAll(){return new Promise(r=>{if(!db)return r([]);try{const q=db.transaction('m').objectStore('m').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}catch(e){r([])}})}
function dbPut(o){try{db&&db.transaction('m','readwrite').objectStore('m').put(o)}catch(e){}}
function dbDel(k){try{db&&db.transaction('m','readwrite').objectStore('m').delete(k)}catch(e){}}
// ---- three.js
const cv=$('cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(40,1,.1,100);C.position.set(0,1.3,4);
const OC=new THREE.OrbitControls(C,cv);OC.enableDamping=true;OC.target.set(0,.9,0);
const root=new THREE.Group();S.add(root);
const ground=new THREE.Mesh(new THREE.CircleGeometry(2.6,48),new THREE.MeshStandardMaterial({color:0x222230,roughness:.9}));
ground.rotation.x=-Math.PI/2;S.add(ground);
const lights=new THREE.Group();S.add(lights);
const LP={studio:{bg:0x1a1a22,l:[['a',0xffffff,.6],['d',0xffffff,1.1,[3,5,4]],['d',0x8899ff,.4,[-4,2,-3]]]},
neon:{bg:0x0a0618,l:[['a',0x331144,.5],['p',0xff2e9a,2.2,[-3,2,2]],['p',0x22d3ee,2.2,[3,2,2]]]},
sunset:{bg:0x3a1d2b,l:[['a',0x884433,.5],['d',0xff9a4d,1.6,[4,2,3]],['d',0x5566aa,.4,[-3,3,-2]]]},
moon:{bg:0x07101f,l:[['a',0x223355,.5],['d',0x88aaff,1,[-3,5,2]]]},
spot:{bg:0x050505,l:[['a',0x111111,.15],['s',0xffffff,3,[0,6,1]]]}};
function setLight(k){lights.clear();const p=LP[k];S.background=new THREE.Color(p.bg);
 p.l.forEach(([t,c,i,pos])=>{let L;if(t=='a')L=new THREE.AmbientLight(c,i);else if(t=='d'){L=new THREE.DirectionalLight(c,i);L.position.set(...pos)}else if(t=='p'){L=new THREE.PointLight(c,i,20);L.position.set(...pos)}else{L=new THREE.SpotLight(c,i,20,.45,.5);L.position.set(...pos);L.target.position.set(0,0,0);lights.add(L.target)}lights.add(L)})}
function resize(){const s=$('stage');R.setSize(s.clientWidth,s.clientHeight,false);C.aspect=s.clientWidth/s.clientHeight;C.updateProjectionMatrix()}
new ResizeObserver(resize).observe($('stage'));
// ---- aura particles
function setAura(e){auraType=e;if(auraPts){S.remove(auraPts);auraPts=null}if(!e)return;
 const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.font='44px serif';x.textAlign='center';x.textBaseline='middle';x.fillText(e,32,34);
 const N=120,g=new THREE.BufferGeometry(),a=new Float32Array(N*3);for(let i=0;i<N;i++){a[i*3]=(Math.random()-.5)*4;a[i*3+1]=Math.random()*3;a[i*3+2]=(Math.random()-.5)*4}
 g.setAttribute('position',new THREE.BufferAttribute(a,3));
 auraPts=new THREE.Points(g,new THREE.PointsMaterial({size:.16,map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));S.add(auraPts)}
function tickAura(t){if(!auraPts)return;const a=auraPts.geometry.attributes.position.array,up=auraType=='🔥'||auraType=='💜',dn=auraType=='❄️';
 for(let i=0;i<a.length;i+=3){if(up)a[i+1]+=.012;else if(dn)a[i+1]-=.01;else{a[i]+=Math.sin(t+i)*.002;a[i+1]+=Math.cos(t*.7+i)*.002}
  if(a[i+1]>3.2)a[i+1]=0;if(a[i+1]<0)a[i+1]=3.2}auraPts.geometry.attributes.position.needsUpdate=true}
// ---- load model
const loader=new THREE.GLTFLoader();
function show(it){cur=it;renderList();$('msg').style.display='none';
 loader.parse(it.data.slice(0),'',g=>{
  if(model)root.remove(model);if(mixer)mixer.stopAllAction();
  model=g.scene;const box=new THREE.Box3().setFromObject(model),sz=box.getSize(new THREE.Vector3()),ctr=box.getCenter(new THREE.Vector3());
  const k=(it.type=='car'?4.2:1.8)/Math.max(it.type=='car'?Math.max(sz.x,sz.z):sz.y,.001);
  model.scale.setScalar(k);model.position.set(-ctr.x*k,-box.min.y*k,-ctr.z*k);root.add(model);
  wheels=[];model.traverse(o=>{if(it.type=='car'&&/wheel/i.test(o.name)&&!/dummy/i.test(o.name))wheels.push(o)});
  clips=g.animations;mixer=clips.length?new THREE.AnimationMixer(model):null;
  const sel=$('anim');sel.innerHTML='<option value="-1">بدون انیمیشن</option>'+clips.map((c,i)=>`<option value="${i}">${c.name||'Clip '+(i+1)}</option>`).join('');
  if(it.type=='car'){sel.innerHTML+='<option value="w">چرخش چرخ‌ها</option>'}
  if(clips.length){sel.value='0';play(0)}
  OC.target.set(0,it.type=='car'?.7:.9,0);C.position.set(0,it.type=='car'?2:1.3,it.type=='car'?7:4);
 },e=>{$('msg').style.display='flex';$('msg').textContent='خواندن فایل ناموفق بود (فقط GLB/GLTF)'})}
function play(i){if(!mixer)return;if(action)action.stop();action=mixer.clipAction(clips[i]);action.reset().play()}
$('anim').onchange=e=>{const v=e.target.value;if(v=='w'||v=='-1'){if(action)action.stop();action=null;window._w=v=='w'}else{window._w=false;play(+v)}};
$('light').onchange=e=>setLight(e.target.value);$('aura').onchange=e=>setAura(e.target.value);
$('spin').onclick=()=>{spin=!spin;$('spin').textContent='چرخش خودکار: '+(spin?'روشن':'خاموش')};
// ---- list/upload
function renderList(){const L=$('list');L.innerHTML='';
 items.filter(i=>i.type==tab).sort((a,b)=>a.num-b.num).forEach(it=>{const d=document.createElement('div');d.className='it'+(cur&&cur.key==it.key?' on':'');
  d.innerHTML=`<b>${it.num}</b><span></span><i title="حذف">✕</i>`;d.querySelector('span').textContent=it.name;
  d.onclick=()=>show(it);d.querySelector('i').onclick=ev=>{ev.stopPropagation();items=items.filter(x=>x!==it);dbDel(it.key);renderList()};L.appendChild(d)})}
$('upb').onclick=()=>$('file').click();
$('file').onchange=async e=>{let n=parseInt($('num').value);for(const f of e.target.files){const data=await f.arrayBuffer();
 const it={key:Date.now()+Math.random()+'',type:tab,num:isNaN(n)?items.filter(i=>i.type==tab).length:n,name:f.name.replace(/\.(glb|gltf)$/i,''),data};
 items.push(it);dbPut(it);if(!isNaN(n))n++}
 e.target.value='';renderList();show(items[items.length-1])};
function setTab(t){tab=t;$('tS').classList.toggle('on',t=='skin');$('tC').classList.toggle('on',t=='car');$('upb').textContent=t=='skin'?'آپلود اسکین':'آپلود ماشین';renderList()}
$('tS').onclick=()=>setTab('skin');$('tC').onclick=()=>setTab('car');
// ---- loop
const clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=clock.getDelta(),t=clock.elapsedTime;
 if(mixer)mixer.update(dt);if(window._w)wheels.forEach(w=>w.rotation.x+=dt*8);
 if(spin&&model)root.rotation.y+=dt*.4;tickAura(t);OC.update();R.render(S,C)}
(async()=>{await openDB();items=await dbAll();setLight('studio');resize();setTab('skin');loop()})();
</script>
</body>
</html>
